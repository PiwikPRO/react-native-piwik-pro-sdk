name: Finalize release

on:
  pull_request:
    branches:
      - master
    types:
      - closed

concurrency:
  group: finalize-release
  cancel-in-progress: false

jobs:
  finalize-release:
    name: Create tag and GitHub release
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'bump-') &&
      contains(github.event.pull_request.labels.*.name, 'release')
    permissions:
      actions: write
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout merged release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Validate release commit
        id: release
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          RELEASE_VERSION=$(node -p "require('./package.json').version")
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use the X.Y.Z format without a v prefix."
            exit 1
          fi

          if [ "$HEAD_BRANCH" != "bump-$RELEASE_VERSION" ]; then
            echo "Branch $HEAD_BRANCH does not match package version $RELEASE_VERSION."
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            echo "Tag $RELEASE_VERSION already exists."
            exit 1
          fi

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Create and push release tag
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_VERSION" -m "Release $RELEASE_VERSION"
          git push origin "refs/tags/$RELEASE_VERSION"
      - name: Create GitHub release
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "$RELEASE_VERSION" \
            --verify-tag \
            --title "$RELEASE_VERSION" \
            --generate-notes
      - name: Start staged npm publishing
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: gh workflow run main.yml --ref "$RELEASE_VERSION" -f version="$RELEASE_VERSION"
