name: Stage npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to stage, for example 2.3.0
        required: true
        type: string

concurrency:
  group: npm-stage-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  stage-package:
    name: Validate and stage package
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: '0'
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22.21.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Validate release source
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use the X.Y.Z format without a v prefix."
            exit 1
          fi

          if [ "$GITHUB_REF" != "refs/tags/$RELEASE_VERSION" ]; then
            echo "Workflow must run from tag $RELEASE_VERSION, but it runs from $GITHUB_REF."
            exit 1
          fi

          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "package.json version $PACKAGE_VERSION does not match tag $RELEASE_VERSION."
            exit 1
          fi

          TAG_COMMIT=$(git rev-parse "$RELEASE_VERSION^{commit}")
          HEAD_COMMIT=$(git rev-parse HEAD)
          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "Checked-out commit $HEAD_COMMIT does not match tag commit $TAG_COMMIT."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run checks
        run: |
          npm test
          npm run lint
          npm run typescript
          npm run prepare
      - name: Install npm with staged publishing support
        run: npm install --global npm@11.19.1
      - name: Stage package release
        run: npm run release-ci
