name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 2.3.0
        required: true
        type: string

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Validate and create version bump pull request
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: '0'
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22.21.0
      - name: Validate version
        run: |
          node <<'NODE'
          const requested = process.env.RELEASE_VERSION;
          const current = require('./package.json').version;
          const pattern = /^\d+\.\d+\.\d+$/;

          if (!pattern.test(requested)) {
            throw new Error('Version must use the X.Y.Z format without a v prefix.');
          }
          if (!pattern.test(current)) {
            throw new Error(`Current package version ${current} does not use the X.Y.Z format.`);
          }

          const compare = (left, right) => {
            const a = left.split('.').map(Number);
            const b = right.split('.').map(Number);
            for (let index = 0; index < a.length; index += 1) {
              if (a[index] !== b[index]) return a[index] - b[index];
            }
            return 0;
          };

          if (compare(requested, current) <= 0) {
            throw new Error(`Version ${requested} must be newer than current version ${current}.`);
          }
          NODE

          if git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            echo "Tag $RELEASE_VERSION already exists."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Set version
        run: npm --no-git-tag-version --allow-same-version version "$RELEASE_VERSION"
      - name: Sync yarn.lock
        run: corepack enable && YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install
      - name: Build and check release
        run: |
          npm run prepare
          npm test
          npm run lint
          npm run typescript
      - name: Create version bump pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ github.token }}
          commit-message: "chore: bump version to ${{ inputs.version }}"
          title: "chore: bump version to ${{ inputs.version }}"
          body: "Automated version bump to ${{ inputs.version }}. Merging this pull request will create the GitHub release and stage the npm package."
          branch: "bump-${{ inputs.version }}"
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true
          labels: release
      - name: Show pull request
        run: |
          PR_URL="${{ steps.cpr.outputs.pull-request-url }}"
          if [ -z "$PR_URL" ]; then
            echo "The version bump did not create a pull request."
            exit 1
          fi

          echo "Review and merge: $PR_URL"
          echo "### Release $RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "Review and merge [$PR_URL]($PR_URL) to continue the release." >> "$GITHUB_STEP_SUMMARY"
